<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>3D Viewer</title>

    <!-- Google製 model-viewer の読み込み -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #050505;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .wrapper {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      model-viewer {
        width: min(90vw, 90vh);
        height: min(90vw, 90vh);
        outline: none;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <!-- ここで glb / gltf を読み込む -->
      <!-- src を貴方のファイルパスに変更してください -->
      <model-viewer
        src="hitoritohito.glb"
        alt="3D Model"
        camera-controls
        auto-rotate
        autoplay
        exposure="1.1"
        shadow-intensity="0.6"
        disable-zoom="false"
      >
      </model-viewer>
    </div>
  </body>
</html>
